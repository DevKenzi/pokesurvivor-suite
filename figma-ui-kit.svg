<svg width="860" height="580" viewBox="0 0 860 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_canvas" x1="0" y1="0" x2="860" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>

    <!-- Pokédex Red Header -->
    <linearGradient id="pokedex_red" x1="0" y1="0" x2="316" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Scanner Blue Lens -->
    <radialGradient id="scanner_lens" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>

    <!-- Panel Shadow -->
    <filter id="shadow_pokedex" x="-20" y="-10" width="356" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="shadow_pill" x="-10" y="-5" width="140" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 20px; fill: #f8fafc; letter-spacing: 0.3px; }
    .t-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #94a3b8; }
    .t-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 12px; fill: #f8fafc; letter-spacing: 0.5px; }
    .t-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 11px; fill: #f1f5f9; }
    .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 9px; fill: #64748b; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; fill: #94a3b8; font-weight: 800; }
  </style>

  <!-- Canvas Background -->
  <rect width="860" height="580" rx="16" fill="url(#bg_canvas)" stroke="#1e293b" stroke-width="1"/>

  <!-- Title Banner -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="t-title">PokéSurvivor Silph Scope v2.5</text>
    <text x="0" y="22" class="t-desc">Authentic Pokémon Device &amp; Pokédex Interface</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. MAIN POKÉDEX / SILPH SCOPE DEVICE -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 85)" filter="url(#shadow_pokedex)">
    <rect width="316" height="420" rx="18" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>

    <!-- Red Top Casing -->
    <path d="M0 18C0 8.05888 8.05887 0 18 0H298C307.941 0 316 8.05888 316 18V44H0V18Z" fill="url(#pokedex_red)"/>
    <line x1="0" y1="44" x2="316" y2="44" stroke="#991b1b" stroke-width="2"/>

    <!-- Big Blue Scanner Lens -->
    <circle cx="25" cy="22" r="11" fill="url(#scanner_lens)" stroke="#ffffff" stroke-width="2"/>
    <!-- Mini LEDs -->
    <circle cx="48" cy="22" r="3.5" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="58" cy="22" r="3.5" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <circle cx="68" cy="22" r="3.5" fill="#10b981" stroke="#064e3b" stroke-width="1"/>

    <!-- Safe Ranking Badge -->
    <rect x="220" y="13" width="82" height="18" rx="9" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="230" cy="22" r="2.5" fill="#10b981"/>
    <text x="238" y="25" class="t-mono" fill="#ffffff" font-size="8px">SAFE: RANKING</text>

    <!-- Subheader -->
    <rect x="0" y="46" width="316" height="30" fill="#080d1a"/>
    <line x1="0" y1="76" x2="316" y2="76" stroke="#182234" stroke-width="1"/>
    <text x="14" y="66" class="t-head">SILPH SCOPE</text>
    <rect x="96" y="54" width="38" height="14" rx="3" fill="#ef4444" fill-opacity="0.2"/>
    <text x="101" y="64" class="t-mono" fill="#ef4444" font-size="8.5px">GEN-9</text>
    <text x="265" y="65" class="t-mono" fill="#64748b" font-size="9px">VER 2.5</text>

    <!-- Tabs Bar -->
    <g transform="translate(12, 86)">
      <rect width="292" height="28" rx="7" fill="#060913" stroke="#1a2336" stroke-width="1"/>
      <!-- Active Tab: ITEMFINDER -->
      <rect x="2" y="2" width="94" height="24" rx="5" fill="#dc2626"/>
      <text x="14" y="18" class="t-mono" fill="#ffffff" font-size="9.5px">ITEMFINDER</text>
      <!-- Inactive: BAG & UTILS -->
      <text x="114" y="18" class="t-mono" fill="#94a3b8" font-size="9.5px">BAG &amp; UTILS</text>
      <!-- Inactive: POKÉ-LAB -->
      <text x="214" y="18" class="t-mono" fill="#94a3b8" font-size="9.5px">POKÉ-LAB</text>
    </g>

    <!-- Tab 1: ITEMFINDER Row -->
    <g transform="translate(12, 126)">
      <rect width="292" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="20" class="t-label">Silph Scope Radar</text>
      <text x="12" y="33" class="t-sub">Scan on-screen &amp; edge targets</text>

      <!-- Poké Ball Sliding Toggle (ON) -->
      <g transform="translate(240, 11)">
        <rect width="40" height="20" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
        <!-- Pokéball Knob -->
        <g transform="translate(19, 2)">
          <circle cx="8" cy="8" r="7.5" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
          <path d="M0.5 8A7.5 7.5 0 0 1 15.5 8Z" fill="#ef4444"/>
          <line x1="0.5" y1="8" x2="15.5" y2="8" stroke="#1e293b" stroke-width="1"/>
          <circle cx="8" cy="8" r="2.2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
        </g>
      </g>
    </g>

    <!-- 2x2 Entity Chips -->
    <g transform="translate(12, 178)">
      <!-- Chests -->
      <rect x="0" y="0" width="142" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="21" r="3.5" fill="#fbbf24"/>
      <text x="24" y="18" class="t-label">Chests</text>
      <text x="24" y="30" class="t-mono" fill="#fbbf24" font-size="8px">Item Balls</text>
      <rect x="118" y="14" width="14" height="14" rx="3" fill="#fbbf24"/>

      <!-- Altars -->
      <rect x="150" y="0" width="142" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="164" cy="21" r="3.5" fill="#38bdf8"/>
      <text x="174" y="18" class="t-label">Altars</text>
      <text x="174" y="30" class="t-mono" fill="#38bdf8" font-size="8px">Stat Shrines</text>
      <rect x="268" y="14" width="14" height="14" rx="3" fill="#38bdf8"/>

      <!-- Healing -->
      <rect x="0" y="50" width="142" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="71" r="3.5" fill="#4ade80"/>
      <text x="24" y="68" class="t-label">Healing</text>
      <text x="24" y="80" class="t-mono" fill="#4ade80" font-size="8px">Full Restore</text>
      <rect x="118" y="64" width="14" height="14" rx="3" fill="#4ade80"/>

      <!-- Bosses -->
      <rect x="150" y="50" width="142" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="164" cy="71" r="3.5" fill="#ef4444"/>
      <text x="174" y="68" class="t-label">Bosses</text>
      <text x="174" y="80" class="t-mono" fill="#ef4444" font-size="8px">Elites &amp; Star</text>
      <rect x="268" y="64" width="14" height="14" rx="3" fill="#ef4444"/>
    </g>

    <!-- Quality of Life Summary Row -->
    <g transform="translate(12, 280)">
      <rect width="292" height="38" rx="8" fill="#080d1a" stroke="#182234" stroke-width="1"/>
      <text x="12" y="23" class="t-label">Infinite Card Rerolls (∞)</text>
      <rect x="238" y="10" width="44" height="18" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="245" y="22" class="t-mono" fill="#38bdf8" font-size="8.5px">ACTIVE</text>
    </g>

    <!-- Combat Cards Preview -->
    <g transform="translate(12, 328)">
      <rect width="292" height="44" rx="8" fill="#18131d" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="19" class="t-label">Rare Candy Overdrive (God Mode)</text>
      <text x="12" y="32" class="t-sub" fill="#94a3b8">45k HP • 1,900x ATK • Shell Bell</text>
      <rect x="248" y="13" width="34" height="18" rx="4" fill="#1e293b"/>
      <text x="256" y="25" class="t-mono" fill="#94a3b8">OFF</text>
    </g>

    <!-- Footer -->
    <path d="M0 388H316V402C316 411.941 307.941 420 298 420H18C8.05888 420 0 411.941 0 402V388Z" fill="#080d1a"/>
    <line x1="0" y1="388" x2="316" y2="388" stroke="#182234" stroke-width="1"/>
    <text x="14" y="407" class="t-sub">Toggle with key</text>
    <rect x="282" y="394" width="20" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="289" y="407" class="t-mono" fill="#f8fafc">H</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. FLOATING TRIGGER PILL & DETAILS -->
  <!-- ========================================================================= -->
  <g transform="translate(400, 85)">
    <text x="0" y="0" class="t-head" fill="#94a3b8">FLOATING TRIGGER PILL</text>

    <g transform="translate(0, 16)" filter="url(#shadow_pill)">
      <rect width="130" height="38" rx="19" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <!-- SVG Pokéball -->
      <g transform="translate(12, 10)">
        <circle cx="9" cy="9" r="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
        <path d="M1 9H17" stroke="#0f172a" stroke-width="1.6"/>
        <path d="M1 9A8 8 0 0 1 17 9Z" fill="#ef4444"/>
        <circle cx="9" cy="9" r="2.8" fill="#0f172a"/>
        <circle cx="9" cy="9" r="1.4" fill="#ffffff"/>
      </g>
      <text x="38" y="24" class="t-head" font-size="12px">SILPH</text>
      <rect x="86" y="10" width="32" height="18" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4"/>
      <text x="94" y="22" class="t-mono" fill="#ef4444">[H]</text>
    </g>

    <!-- Design Tokens / Palette -->
    <g transform="translate(0, 86)">
      <text x="0" y="0" class="t-head" fill="#94a3b8">POKÉDEX PALETTE TOKENS</text>

      <g transform="translate(0, 14)">
        <rect width="240" height="34" rx="8" fill="#b91c1c" stroke="#ef4444" stroke-width="1"/>
        <text x="14" y="21" class="t-mono" fill="#ffffff">#B91C1C  Pokédex Red Casing</text>
      </g>

      <g transform="translate(0, 56)">
        <rect width="240" height="34" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" class="t-mono" fill="#cbd5e1">#0B1120  OLED Dark Screen</text>
      </g>

      <g transform="translate(0, 98)">
        <rect width="240" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="20" cy="17" r="5" fill="#3b82f6"/>
        <text x="34" y="21" class="t-mono" fill="#60a5fa">#3B82F6  Scanner Lens (Blue)</text>
      </g>

      <g transform="translate(0, 140)">
        <rect width="240" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="20" cy="17" r="5" fill="#fbbf24"/>
        <text x="34" y="21" class="t-mono" fill="#fbbf24">#FBBF24  Item Balls (Chests)</text>
      </g>

      <g transform="translate(0, 182)">
        <rect width="240" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="20" cy="17" r="5" fill="#10b981"/>
        <text x="34" y="21" class="t-mono" fill="#34d399">#10B981  Safe Anti-Cheat (Green)</text>
      </g>
    </g>
  </g>
</svg>
